name: meld_showcase_cockpit
publish_to: none
description: Development-only Cockpit shell for the Meld Showcase.

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  meld:
    path: ../../../packages/meld
  meld_showcase:
    path: ..

dev_dependencies:
  flutter_cockpit: ^4.0.42
  flutter_cockpit_test: ^4.0.42
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  lints: ^5.1.1

dependency_overrides:
  meld: 
    path: ../../../packages/meld
  meld_core:
    path: ../../../packages/meld_core
  meld_font:
    path: ../../../packages/meld_font
  meld_flutter:
    path: ../../../packages/meld_flutter

flutter:
  uses-material-design: true
